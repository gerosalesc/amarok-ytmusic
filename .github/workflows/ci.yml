name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies & run pytest
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -v

  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel & sdist and verify bundled Amarok assets
        run: |
          uv build
          python3 - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected 1 wheel, got {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {
              "amarok_ytmusic/web/index.html",
              "amarok_ytmusic/assets/amarok_script/main.js",
              "amarok_ytmusic/assets/amarok_kpackage/org.kde.amarok.currenttrack/contents/ui/main.qml",
              "amarok_ytmusic/assets/amarok_kpackage/org.kde.amarok.lyrics/contents/ui/main.qml",
          }
          missing = required - names
          assert not missing, f"Missing bundled files in wheel: {missing}"
          print("Wheel verification passed:", wheels[0])
          PY
