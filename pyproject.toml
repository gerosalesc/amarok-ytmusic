[project]
name = "amarok-ytmusic"
version = "0.1.0"
description = "YouTube Music streaming & web-auth integration plugin for Amarok 3.3+ (KDE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "ytmusicapi>=1.9.0",
    "yt-dlp[default]>=2025.1.0",
    "jeepney>=0.9.0",
    "mutagen>=1.48.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
amarok-ytmusic = "amarok_ytmusic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amarok_ytmusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
